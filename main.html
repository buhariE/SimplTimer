<!DOCTYPE html>
<html lang="en">
<head>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/53851b2526.js" crossorigin="anonymous"></script> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplTimer</title>
    <link rel="stylesheet" href="resources/css/main.css">
</head>
<body>
    <header>
        <div class="title">SimplTimer</div>
        <div class="themeToggleWrapper" onclick="toggleTheme()">
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-sun"></i>
            <div class="themeToggleCircle">
                <i class="fa-solid fa-moon"></i>
            </div>
        </div>
    </header>
    <main>
        <div class="interactivePops default hide">
            <span class="icon">
                <i class="fa-solid fa-bell"></i>
            </span>
            <span class="content">
                Message : Hello Word !
            </span>
        </div>
        <div class="cardContentWrapper">
            <div class="contentCards">
                <div class="contentCard" id="worldClockCard" onload="displayTime()">
                    <div class="cardHead">
                        <div class="timeZoneDropDown" onclick="openBackDrop()">
                            <div class="timezoneValue">Time zone</div>
                            <div class="dropDownBtn">
                                <i class="fa-solid fa-caret-up"></i>
                                <i class="fa-solid fa-caret-down"></i>
                            </div>
                        </div>
                        <div class="hourFormatToggle" onclick="toggleFormat()">
                            <div class="format12">12H</div>
                            <div class="format24">24H</div>
                            <div class="hourToggleCircle">
                                12H
                            </div>
                        </div>
                    </div>
                    <div class="cardBody">
                        <div class="worldTimeWrapper">
                            <div class="timeHours">00</div>
                            <div class="timeSeparator">:</div>
                            <div class="timeMinutes">00</div>
                            <div class="timeSeconds">00</div>
                            <div class="timePeriod">AM</div>
                        </div>
                    </div>
                </div>
                <div class="contentCard" id="timerCard">
                    <div class="cardHead">
                        <div class="customTimersWrappers">
                            <div class="customTimer empty">
                                <div class="delete">
                                    <i class="fa-solid fa-xmark"></i>
                                </div>
                            </div>
                            <div class="customTimer empty">
                                <div class="delete">
                                    <i class="fa-solid fa-xmark"></i>
                                </div>
                            </div>
                            <div class="customTimer empty">
                                <div class="delete">
                                    <i class="fa-solid fa-xmark"></i>
                                </div>
                            </div>
                            <div class="customTimer empty">
                                <div class="delete">
                                    <i class="fa-solid fa-xmark"></i>
                                </div>
                            </div>
                            <div class="customTimer empty">
                                <div class="delete">
                                    <i class="fa-solid fa-xmark"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cardBody">
                        <div class="timerWrapper">
                            <div class="timerHours">
                                <div class="increment" onclick="incrementTime('hours')">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </div>

                                <div class="value">
                                    <span class="digits">00</span>
                                    <span class="label">H</span> 
                                </div>
                                <div class="decrement" onclick="decrementTime('hours')">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </div>
                            </div>
                            <div class="timerSeparator">:</div>
                            <div class="timerMinutes">
                                <div class="increment" onclick="incrementTime('minutes')">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </div>
                                <div class="value">
                                    <span class="digits">00</span>
                                    <span class="label">M</span> 
                                </div>
                                <div class="decrement" onclick="decrementTime('minutes')">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </div>
                            </div>
                            <div class="timerSeconds">
                                <div class="increment" onclick="incrementTime('seconds')">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </div>
                                <div class="value">
                                    <span class="digits">00</span>
                                    <span class="label">S</span> 
                                </div>
                                <div class="decrement" onclick="decrementTime('seconds')">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </div>
                            </div>
                        </div>
                        <div class="timerSideButtons">
                            <div class="resetButton disabled" aria-disabled="true">
                                <i class="fa-solid fa-rotate-right"></i>
                            </div>
                            <div class="playButton disabled" aria-disabled="true">
                                <i class="fa-solid fa-play"></i>
                            </div>
                            <div class="addButton disabled" aria-disabled="true">
                                <i class="fa-solid fa-plus"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="contentCard" id="stopwatchCard">
                    <div class="cardHead"></div>
                    <div class="cardBody">
                        <div class="stopwatchWrapper">
                            <div class="timeHours">00</div>
                            <div class="timeSeparator">:</div>
                            <div class="timeMinutes">00</div>
                            <div class="timeSeconds">00</div>
                        </div>
                        <div class="stopwatchSideButtons">
                            <div class="resetButton disabled">
                                <i class="fa-solid fa-rotate-right"></i>
                            </div>
                            <div class="playButton">
                                <i class="fa-solid fa-play"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="menuWrapper">
            <!-- To do: move activemenu back to here -->
            <div class="menuItem activeMenu" id="worldClock" onclick="moveCards(0)">
                <i class="fa-solid fa-globe"></i>
                <div>World clock</div>
            </div>
            <div class="menuItem" id="timer" onclick="moveCards(1)">
                <i class="fa-solid fa-hourglass-half"></i>
                <div>Timer</div>
            </div>
            <div class="menuItem" id="stopwatch" onclick="moveCards(2)">
                <i class="fa-solid fa-stopwatch"></i>
                <div>Stopwatch</div>
            </div>
        </div>
        <div class="timezoneBackDrop" onclick="closeBackDropOnClickOutside(event)">
            <div class="timezoneDropDownContent">
                <div class="tzDDCheader">
                    <div class="headertext">
                        Choose a time zone
                    </div>
                    <div class="closeBtn" onclick="closeBackDrop()">
                        <i class="fa-solid fa-xmark"></i>
                    </div>
                </div>
                <div class="tzDDCSearch">
                    <div class="searchWrapper">
                        <input type="search" name="" id="" placeholder="Search by city/state/province">
                        <i class="fa-solid fa-search"></i>
                    </div>
                </div>
                <div class="tzDDCList">
                    <div class="tzDDCListItem loadingItem">Loading...</div>
                    <div class="tzDDCListItem loadingItem">Loading...</div>
                    <div class="tzDDCListItem loadingItem">Loading...</div>
                    <div class="tzDDCListItem loadingItem">Loading...</div>
                    <div class="tzDDCListItem loadingItem">Loading...</div>
                    
                    <!-- Time zone list items will be populated here dynamically -->
                </div>
            </div>
        </div>
    </main>
</body>
<script src="logic/main.js"></script>
</html>
