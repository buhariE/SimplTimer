<!DOCTYPE html>
<html lang="en">
<head>
    <!-- font awesome -->
    <script src="https://kit.fontawesome.com/53851b2526.js" crossorigin="anonymous"></script> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplTimer</title>
    <link rel="stylesheet" href="resources/css/main.css">
</head>
<body>
    <header>
        <div class="title">SimplTimer</div>
        <div class="themeToggleWrapper">
            <i class="fa-solid fa-moon"></i>
            <i class="fa-solid fa-sun"></i>
            <div class="themeToggleCircle">
                <i class="fa-solid fa-moon"></i>
            </div>
        </div>
    </header>
    <main>
        <div class="cardContentWrapper">
            <div class="contentCards">
                <div class="contentCard">
                    <div class="cardHead"></div>
                    <div class="cardBody"></div>
                </div>
                <div class="contentCard">
                    <div class="cardHead"></div>
                    <div class="cardBody"></div>
                </div>
                <div class="contentCard">
                    <div class="cardHead"></div>
                    <div class="cardBody"></div>
                </div>
            </div>
        </div>
        <div class="menuWrapper">
            <div class="menuItem activeMenu" id="world-clock">
                <i class="fa-solid fa-globe"></i>
                <div>World clock</div>
            </div>
            <div class="menuItem" id="timer">
                <i class="fa-solid fa-hourglass-half"></i>
                <div>Timer</div>
            </div>
            <div class="menuItem" id="stopwatch">
                <i class="fa-solid fa-stopwatch"></i>
                <div>Stopwatch</div>
            </div>
        </div>
    </main>
</body>
<script src="logic/main.js"></script>
</html>
